[project]
name = "tally-backend"
version = "0.1.0"
description = "Tally — FastAPI backend"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "pydantic>=2",
    "psycopg[binary]",
    "openai>=3,<4",
    "openai-agents~=0.22.0",
    "httpx",
    "PyJWT",
    "cryptography",
]

[dependency-groups]
dev = [
    "uvicorn",
]
# The eval harness (evals/collect.py, evals/replay.py) still runs on Langfuse
# datasets and experiments — FireTrace has no counterpart yet
# (docs/FIRETRACE_FEEDBACK.md). Opt in: uv run --group evals python -m evals.replay
evals = [
    "langfuse>=4.7.0",
    "openinference-instrumentation-openai-agents",
]

[tool.pytest.ini_options]
markers = [
    "live: hits real external services (network, DB, LLM APIs); deselect with -m 'not live'",
]
