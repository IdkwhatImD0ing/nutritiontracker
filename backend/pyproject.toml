[project]
name = "usual-backend"
version = "0.1.0"
description = "Usual — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "psycopg[binary]",
    "openai>=3,<4",
    "openai-agents~=0.22.0",
    "langfuse>=4.7.0",
    "openinference-instrumentation-openai-agents",
    "httpx",
    "PyJWT",
    "cryptography",
]

[dependency-groups]
dev = [
    "uvicorn",
]
