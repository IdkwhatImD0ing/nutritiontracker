[project]
name = "tally-backend"
version = "0.1.0"
description = "Tally — FastAPI backend"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "pydantic>=2",
    "psycopg[binary]",
    "openai>=3,<4",
    "openai-agents~=0.22.0",
    "httpx",
    "PyJWT",
    "cryptography",
    "mcp>=2.2.0,<3",
]

[dependency-groups]
dev = [
    "uvicorn",
]

[tool.pytest.ini_options]
markers = [
    "live: hits real external services (network, DB, LLM APIs); deselect with -m 'not live'",
]
